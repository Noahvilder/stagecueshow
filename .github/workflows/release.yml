name: Build Windows app
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: Build offline app files
        run: bun run build
        env:
          STAGECUE_DESKTOP: "1"
      - name: Copy offline files into app folder
        shell: bash
        run: |
          SRC=dist/client
          if [ ! -f "$SRC/index.html" ]; then
            SRC=$(dirname "$(find dist .output -name index.html -not -path '*/node_modules/*' 2>/dev/null | head -n1)")
          fi
          echo "Using $SRC"; ls -la "$SRC"
          test -f "$SRC/index.html"
          rm -rf src-tauri/dist && mkdir -p src-tauri/dist
          cp -r "$SRC"/. src-tauri/dist/
          ls -la src-tauri/dist
      - run: bunx @tauri-apps/cli@2 icon src-tauri/app-icon.png
      - run: bunx @tauri-apps/cli@2 build
      - uses: actions/upload-artifact@v4
        with:
          name: StageCue-Setup
          path: src-tauri/target/release/bundle/nsis/*.exe
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
