name: Build Windows app
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: Build offline app files
        run: bun run build
        env:
          STAGECUE_DESKTOP: "1"
      - name: Copy offline files into app folder
        shell: bash
        run: |
          SRC=dist/client
          if [ ! -f "$SRC/index.html" ]; then
            SRC=$(dirname "$(find dist .output -name index.html -not -path '*/node_modules/*' 2>/dev/null | head -n1)")
          fi
          echo "Using $SRC"; ls -la "$SRC"
          test -f "$SRC/index.html"
          rm -rf src-tauri/dist && mkdir -p src-tauri/dist
          cp -r "$SRC"/. src-tauri/dist/
          ls -la src-tauri/dist
      - run: bunx @tauri-apps/cli@2 icon src-tauri/app-icon.png
      - name: Get Steinberg ASIO SDK
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://www.steinberg.net/asiosdk -OutFile asiosdk.zip
          Expand-Archive asiosdk.zip -DestinationPath asiosdk
          $common = Get-ChildItem -Recurse -Directory asiosdk | Where-Object { $_.Name -eq 'common' } | Select-Object -First 1
          $dir = $common.Parent.FullName
          "CPAL_ASIO_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "Using $dir"
      - run: bunx @tauri-apps/cli@2 build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
      - name: Write latest.json for in-app updates
        shell: pwsh
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          $sig = Get-Content "$($exe.FullName).sig" -Raw
          $ver = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $name = $exe.Name -replace ' ', '.'
          $tag = "v$ver"
          "TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $url = "https://github.com/${{ github.repository }}/releases/download/$tag/$name"
          @{ version = $ver; notes = "StageCue $ver"; pub_date = (Get-Date).ToUniversalTime().ToString("o"); platforms = @{ "windows-x86_64" = @{ signature = $sig.Trim(); url = $url } } } | ConvertTo-Json -Depth 5 | Out-File src-tauri/target/release/bundle/nsis/latest.json -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: StageCue-Setup
          path: src-tauri/target/release/bundle/nsis/*.exe
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: StageCue ${{ env.TAG }}
          make_latest: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/nsis/latest.json
