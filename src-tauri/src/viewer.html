<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>StageCue scenemonitor</title>
<style>
body{margin:0;background:#0b0b0d;color:#f2f2f2;font-family:system-ui,sans-serif}
#bar{display:flex;justify-content:space-between;padding:8px 14px;font-size:13px;background:#18181c;color:#aaa}
#ok{font-weight:700}.on{color:#3ddc84}.off{color:#ff5a5a}
main{padding:16px 18px}
.l{font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:#888;margin-top:18px}
#song{font-size:22px;font-weight:800;color:#f5c542}
#cue{font-size:30px;font-weight:900;margin-top:4px}
#text{font-size:28px;line-height:1.35;white-space:pre-wrap;margin-top:10px}
#stik,#note{font-size:20px;white-space:pre-wrap;margin-top:6px}
#note{color:#7fd1ff}#next{font-size:20px;color:#bbb}
</style></head><body>
<div id="bar"><span id="show">StageCue</span><span id="ok" class="off">● Forbinder…</span></div>
<main><div id="song"></div><div id="cue">Venter på pulten…</div><div id="text"></div>
<div id="sl" class="l" hidden>Stikord</div><div id="stik"></div>
<div id="nl" class="l" hidden>Min note</div><div id="note"></div>
<div class="l">Næste</div><div id="next">–</div></main>
<script>
var mon=new URLSearchParams(location.search).get("monitor")||"",last=0,$=function(i){return document.getElementById(i)};
function find(s,id){for(var a=0;a<s.songs.length;a++){var g=s.songs[a];for(var b=0;b<g.cues.length;b++)if(g.cues[b].id===id)return{song:g,cue:g.cues[b]}}return null}
function render(s){$("show").textContent=s.showName||"StageCue";var c=find(s,s.currentId||s.standbyId),n=find(s,s.standbyId);
if(!c){$("cue").textContent="Klar";return}
$("song").textContent=c.song.name;$("cue").textContent=c.cue.name;$("text").textContent=c.cue.text||"";
var st=c.cue.stikord||"";$("stik").textContent=st;$("sl").hidden=!st;
var no=(mon&&c.cue.monitorNotes&&c.cue.monitorNotes[mon])||"";$("note").textContent=no;$("nl").hidden=!no;
$("next").textContent=n&&n.cue.id!==c.cue.id?n.song.name+" · "+n.cue.name:"–"}
function go(){var ws=new WebSocket("ws://"+location.host+"/ws");
ws.onmessage=function(e){last=Date.now();try{render(JSON.parse(e.data))}catch(x){}};
ws.onclose=function(){setTimeout(go,1500)}}
setInterval(function(){var on=Date.now()-last<5000;$("ok").textContent=on?"● Forbundet (lokalt Wi-Fi)":"● Venter på signal…";$("ok").className=on?"on":"off"},1000);
go();
</script></body></html>
